[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-identity-resolver"
version = "0.1.0"
description = "Vehicle Identity Resolver — AMD Development Pack v0.1"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
]

[project.scripts]
vir = "vir.cli.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vir = ["resources/*.yaml", "web/templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

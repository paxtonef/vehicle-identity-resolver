<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vehicle Identity Resolver{% endblock %}</title>
  <style>
    :root {
      --border: #d0d5dd;
      --bg: #fafafa;
      --text: #1a1a1a;
      --muted: #6b7280;
      --accent: #2563eb;
      --ok: #16a34a;
      --warn: #d97706;
      --bad: #dc2626;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    h2 { font-size: 1.1rem; margin-top: 1.75rem; }
    .subtitle { color: var(--muted); margin-top: 0; margin-bottom: 1.5rem; }
    fieldset {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      background: white;
    }
    legend { font-weight: 600; padding: 0 0.4rem; }
    label { display: block; margin-top: 0.6rem; font-size: 0.92rem; }
    input[type=text], input[type=number], select {
      width: 100%;
      padding: 0.45rem 0.6rem;
      margin-top: 0.2rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; }
    .checkbox-row input { width: auto; }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.3rem;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover { opacity: 0.92; }
    .status-badge {
      display: inline-block;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: white;
    }
    .status-resolved { background: var(--ok); }
    .status-provisionally_resolved { background: var(--warn); }
    .status-ambiguous { background: var(--warn); }
    .status-insufficient_data { background: var(--muted); }
    .status-contradictory { background: var(--bad); }
    .status-provider_unavailable { background: var(--muted); }
    .status-invalid_identifier { background: var(--bad); }
    .status-unsupported_country { background: var(--bad); }
    table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
    td, th { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { color: var(--muted); font-weight: 600; width: 40%; }
    .limitations, .unresolved { color: var(--muted); font-size: 0.9rem; }
    .limitations li, .unresolved li { margin-bottom: 0.2rem; }
    .error-box {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      font-size: 0.92rem;
    }
    .evidence-source { color: var(--muted); font-size: 0.82rem; }
    a { color: var(--accent); }
    .back-link { display: inline-block; margin-top: 1.5rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Vehicle Identity Resolver</h1>
  <p class="subtitle">{% block subtitle %}Résolution d'identité véhicule{% endblock %}</p>
  {% block content %}{% endblock %}
</body>
</html>
